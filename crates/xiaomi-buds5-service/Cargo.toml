[package]
name = "xiaomi-buds5-service"
version = "0.1.0"
edition = "2021"
description = "D-Bus control service for the Xiaomi Buds 5"

[[bin]]
name = "xiaomi-buds5-service"
path = "src/main.rs"

[dependencies]
zbus = "5.19"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

